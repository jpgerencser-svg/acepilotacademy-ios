<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ace Pilot Academy</title>
  <style>
    html,body{margin:0;height:100%;background:#2C3E54;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
    h1{font-size:20px;font-weight:800;margin:0 0 8px;}
    p{opacity:.8;margin:0 0 20px;font-size:14px;}
    a{display:inline-block;background:#D4A12B;color:#182A4A;font-weight:800;text-decoration:none;padding:12px 20px;border-radius:12px;}
  </style>
</head>
<body>
  <!-- Offline / fallback screen. When online, the app loads app.acepilotacademy.com (server.url in capacitor.config.json). -->
  <div class="wrap">
    <h1>Ace Pilot Academy &mdash; Checkride Ready</h1>
    <p>You appear to be offline. Reconnect to keep studying.</p>
    <a href="https://app.acepilotacademy.com">Retry</a>
  </div>
</body>
</html>
