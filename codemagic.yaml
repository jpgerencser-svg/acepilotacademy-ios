# Cloud build pipeline for Ace Pilot Academy iOS.
# Runs on a cloud Mac (Codemagic): builds + signs the app and uploads it to App Store Connect.
# In Codemagic you must: (1) connect this repo, (2) add your App Store Connect API key as an
#   integration named exactly: AcePilotASC
# If your App Store Connect Bundle ID is not com.acepilotacademy.app, change it below AND in capacitor.config.json.

workflows:
  ios-appstore:
    name: Ace Pilot Academy iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AcePilotASC
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.acepilotacademy.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Generate native iOS project (Capacitor)
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing (auto-create cert + profile via API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
